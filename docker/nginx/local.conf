events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Compose recreates application containers during local builds. Resolve their
  # service names through Docker DNS at request time instead of retaining a
  # startup-time container IP in an upstream block.
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;

  # Reject direct-IP and unexpected Host-header requests on both listeners.
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 80;
    server_name libif.local.com;
    return 308 https://libif.local.com$request_uri;
  }

  server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/libif.local.com.crt;
    ssl_certificate_key /etc/nginx/certs/libif.local.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
  }

  server {
    listen 443 ssl;
    server_name libif.local.com;
    client_max_body_size 50m;

    ssl_certificate /etc/nginx/certs/libif.local.com.crt;
    ssl_certificate_key /etc/nginx/certs/libif.local.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LIBIF_TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    location /api/ {
      set $api_upstream api:3001;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
    }

    location / {
      set $web_upstream web:3000;
      proxy_pass http://$web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
