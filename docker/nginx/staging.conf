events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Application containers can be recreated while staging remains online.
  # Resolve their Compose service names at request time through Docker DNS.
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Tailscale Funnel terminates public HTTPS and proxies only to this loopback
  # listener. No application or infrastructure port is published by Docker.
  server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    client_max_body_size 50m;

    location /api/ {
      set $api_upstream api:3001;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
    }

    location / {
      set $web_upstream web:3000;
      proxy_pass http://$web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
