name: ${COMPOSE_PROJECT_NAME:-libif-production}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-api-environment: &api-environment
  NODE_ENV: production
  API_PORT: "3001"
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.production}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env.production}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.production}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.production}
  LIBIF_WEB_BASE_URL: https://${LIBIF_HOSTNAME:?Set LIBIF_HOSTNAME in .env.production}
  LIBIF_CORS_ORIGINS: ${LIBIF_CORS_ORIGINS:-}
  LIBIF_ENABLE_DEV_AUTH: "false"
  LIBIF_ALLOW_IN_MEMORY_READER_LIMITS: "false"
  LIBIF_TRUST_PROXY: "true"
  LIBIF_SESSION_COOKIE_DOMAIN: ${LIBIF_SESSION_COOKIE_DOMAIN:-}
  LIBIF_SESSION_COOKIE_SECURE: "true"
  LIBIF_SOURCE_ACCESS_TOKEN_SECRET: ${LIBIF_SOURCE_ACCESS_TOKEN_SECRET:?Set LIBIF_SOURCE_ACCESS_TOKEN_SECRET in .env.production}
  READER_PAGE_RATE_LIMIT_PER_MIN: ${READER_PAGE_RATE_LIMIT_PER_MIN:-60}
  READER_IMPOSSIBLE_RATE_PER_MIN: ${READER_IMPOSSIBLE_RATE_PER_MIN:-120}
  READER_MAX_CONCURRENT_SESSIONS: ${READER_MAX_CONCURRENT_SESSIONS:-3}
  READER_MAX_INVALID_PROBES: ${READER_MAX_INVALID_PROBES:-8}
  OCR_LANGUAGES: ${OCR_LANGUAGES:-vie+eng}
  OCR_COMMAND_TIMEOUT_MS: ${OCR_COMMAND_TIMEOUT_MS:-60000}
  OCR_MAX_PAGES: ${OCR_MAX_PAGES:-50}
  OCR_RENDER_DPI: ${OCR_RENDER_DPI:-200}
  OCR_TEMP_ROOT: /tmp/libif-ocr
  OCR_TEMP_STALE_AGE_MS: ${OCR_TEMP_STALE_AGE_MS:-3600000}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_SECURE: ${SMTP_SECURE:-starttls}

x-app-security: &app-security
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=1777

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
    volumes:
      - production_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  redis:
    image: redis:8.8.0-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    volumes:
      - production_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.production}
    volumes:
      - production_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  migrate:
    image: ${LIBIF_MIGRATE_IMAGE:-libif-migrate:production}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: build
    command: npx prisma migrate deploy --config apps/api/prisma.config.ts
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  api:
    image: ${LIBIF_API_IMAGE:-libif-api:production}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    <<: *app-security
    logging: *default-logging
    networks:
      - edge
      - backend

  worker:
    image: ${LIBIF_API_IMAGE:-libif-api:production}
    command: node apps/api/dist/src/worker.main.js
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 2m
    <<: *app-security
    logging: *default-logging
    networks:
      - backend

  web:
    image: ${LIBIF_WEB_IMAGE:-libif-web:production}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${LIBIF_HOSTNAME:?Set LIBIF_HOSTNAME in .env.production}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: https://${LIBIF_HOSTNAME:?Set LIBIF_HOSTNAME in .env.production}
      INTERNAL_API_BASE_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      LIBIF_HOSTNAME: ${LIBIF_HOSTNAME:?Set LIBIF_HOSTNAME in .env.production}
      LIBIF_ACME_EMAIL: ${LIBIF_ACME_EMAIL:?Set LIBIF_ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - production_caddy_data:/data
      - production_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge

volumes:
  production_postgres_data:
  production_redis_data:
  production_minio_data:
  production_caddy_data:
  production_caddy_config:

networks:
  edge:
  backend:
    internal: true
