name: Staging Images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging-images-main
  cancel-in-progress: true

jobs:
  # The reusable CI workflows contain dev-only image publisher jobs. GitHub
  # validates their maximum token permissions even though those jobs skip on
  # main, so each caller must allow the packages permission they declare.
  api-ci:
    name: API quality gate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/api-ci.yml

  web-ci:
    name: Web quality gate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/web-ci.yml

  publish:
    name: Publish main SHA staging images
    needs: [api-ci, web-ci]
    if: ${{ needs.api-ci.result == 'success' && needs.web-ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout validated main revision
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate API image metadata
        id: api-metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/libif-api
          flavor: latest=false
          tags: type=raw,value=${{ github.sha }}

      - name: Build and publish API and worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.api-metadata.outputs.tags }}
          labels: ${{ steps.api-metadata.outputs.labels }}
          cache-from: type=gha,scope=staging-api
          cache-to: type=gha,mode=max,scope=staging-api

      - name: Generate migration image metadata
        id: migrate-metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/libif-migrate
          flavor: latest=false
          tags: type=raw,value=${{ github.sha }}

      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          target: build
          platforms: linux/amd64
          push: true
          tags: ${{ steps.migrate-metadata.outputs.tags }}
          labels: ${{ steps.migrate-metadata.outputs.labels }}
          cache-from: type=gha,scope=staging-api
          cache-to: type=gha,mode=max,scope=staging-api

      - name: Generate web image metadata
        id: web-metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/libif-web
          flavor: latest=false
          tags: type=raw,value=${{ github.sha }}

      - name: Build and publish same-origin staging web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          build-args: NEXT_PUBLIC_API_BASE_URL=
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web-metadata.outputs.tags }}
          labels: ${{ steps.web-metadata.outputs.labels }}
          cache-from: type=gha,scope=staging-web
          cache-to: type=gha,mode=max,scope=staging-web

      - name: Record staging image release
        shell: bash
        run: |
          {
            echo '### Staging image release'
            echo "Full-SHA images published from main: ${GITHUB_SHA}."
            echo 'No moving image tag was written by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
